name: Capture dashboard screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - "scripts/capture-dashboard.mjs"
      - ".github/workflows/dashboard-screenshots.yml"
permissions:
  contents: write
concurrency:
  group: screenshot-publisher
  cancel-in-progress: true
jobs:
  screenshots:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI dependencies and browser automation
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start actual React dashboard
        run: |
          cd frontend
          npm run dev -- --host 127.0.0.1 > /tmp/aegis-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aegis-vite.log
          exit 1
      - name: Capture browser screenshots with synthetic API fixture
        run: |
          cp scripts/capture-dashboard.mjs frontend/capture-dashboard.mjs
          cd frontend
          node capture-dashboard.mjs
          mkdir -p ../docs/images
          mv docs/images/*.png ../docs/images/
      - name: Commit generated image assets
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/dashboard-overview.png docs/images/fraud-detection-demo.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: add actual React dashboard screenshots with synthetic demo fixtures"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
